name: Publish memory palace to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: palace/package-lock.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
        working-directory: palace
      - name: Build palace
        run: npm run build
        working-directory: palace
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: palace/dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
